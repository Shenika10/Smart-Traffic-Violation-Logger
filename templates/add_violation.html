<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Traffic Violation</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Add Traffic Violation</h1>

        <form method="POST">

            <label for="vehicle_number">Vehicle Number:</label>
            <input type="text"
                   id="vehicle_number"
                   name="vehicle_number"
                   required>

            <label for="violation_type">Violation Type:</label>
            <select id="violation_type"
                    name="violation_type"
                    required>

                <option value="">Select Violation</option>
                <option value="No Helmet">No Helmet</option>
                <option value="Overspeeding">Overspeeding</option>
                <option value="Signal Violation">Signal Violation</option>
                <option value="No Seat Belt">No Seat Belt</option>
                <option value="Drunk Driving">Drunk Driving</option>

            </select>

            <label for="location">Location:</label>
            <input type="text"
                   id="location"
                   name="location"
                   required>

            <label for="date">Date:</label>
            <input type="date"
                   id="date"
                   name="date"
                   required>

            <label for="fine_amount">Fine Amount:</label>
            <input type="number"
                   id="fine_amount"
                   name="fine_amount"
                   min="0"
                   required>

            <br>

            <button type="submit">Add Violation</button>

        </form>

        <br>

        <a href="/">Back to Home</a>

    </div>

</body>

</html>
